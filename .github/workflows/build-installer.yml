name: Build installer

on:
  push:
    branches: [main]
  workflow_call:
    outputs:
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      sha256:
        value: ${{ jobs.build.outputs.sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch Makeself 2.5.0
        uses: actions/checkout@v7
        with:
          repository: megastep/makeself
          ref: release-2.5.0
          path: .release-tools/makeself
          persist-credentials: false
      - name: Install test dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync util-linux shellcheck shfmt
      - name: Check shell scripts and run full test suite
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MAKESELF_DIR: ${{ github.workspace }}/.release-tools/makeself
        run: |
          set -euo pipefail
          scripts=(bin/codex-sync bin/cpush bin/cpull release.sh install.sh uninstall.sh scripts/*.sh tests/*.sh)
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck "${scripts[@]}"
          shfmt -d "${scripts[@]}"
          bash tests/run.sh
      - name: Build and test installer
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=()
          if [[ $REF_TYPE == tag ]]; then args+=("$REF_NAME"); fi
          bash scripts/build-installer.sh .release-tools/makeself dist "${args[@]}"
      - name: Record installer digest
        id: digest
        run: |
          digest=$(sha256sum dist/*.run)
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: installer-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/*.run
          if-no-files-found: error
          retention-days: 1
